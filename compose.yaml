
services:
  postgres:
    image: postgres:18-alpine
    container_name: web-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habib
      POSTGRES_PASSWORD: local_dev_only_123
      POSTGRES_DB: web_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habib -d web_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
